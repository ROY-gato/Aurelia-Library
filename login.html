<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Book<span>Nest</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-icons">
        <a href="cart.html">&#128722; <span class="badge cart-count" style="display:none">0</span></a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="header">
        <span class="auth-logo">Book<span>Nest</span></span>
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="demo@booknest.com" required>
          <span class="error-msg">Please enter a valid email</span>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="pw-field">
            <input type="password" id="loginPass" placeholder="password123" required>
            <button type="button" class="pw-toggle" onclick="const i=document.getElementById('loginPass');i.type=i.type==='password'?'text':'password'">&#128065;</button>
          </div>
          <span class="error-msg">Password is required</span>
        </div>
        <div class="remember-line">
          <label><input type="checkbox" checked> Remember me</label>
          <a href="#" style="color:var(--primary);font-size:0.8rem">Forgot?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Sign In</button>
      </form>
      <div style="text-align:center;margin:1rem 0;color:var(--text-muted);font-size:0.8rem">Demo: demo@booknest.com / password123</div>
      <div class="auth-footer">Don't have an account? <a href="register.html">Create one</a></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      let ok = true;
      if (!email || !email.includes('@')) { document.getElementById('loginEmail').closest('.form-group').classList.add('error'); ok = false; } else { document.getElementById('loginEmail').closest('.form-group').classList.remove('error'); }
      if (!pass) { document.getElementById('loginPass').closest('.form-group').classList.add('error'); ok = false; } else { document.getElementById('loginPass').closest('.form-group').classList.remove('error'); }
      if (!ok) return;

      const success = await login(email, pass);
      if (success) {
        toast('Welcome back! Redirecting...');
        setTimeout(() => window.location = 'index.html', 500);
      } else {
        toast('Invalid email or password.', 'error');
      }
    }
  </script>
</body>
</html>
