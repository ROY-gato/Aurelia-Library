<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Aurelia Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Aurelia<span> Library</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
      </ul>
      <div class="nav-icons">
        <div id="userMenu"></div>
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="card">
      <h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Welcome Back
      </h2>
      <p class="sub">Sign in to buy books, reserve titles, and register for events.</p>
      <form onsubmit="login(event)">
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="demo@lib.com" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPass" placeholder="demo123" required></div>
        <div id="loginError" style="color:var(--danger);font-size:0.82rem;margin-bottom:10px"></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <div class="switch">Don't have an account? <a href="register.html">Register</a></div>
      <div style="margin-top:12px;padding:10px;background:var(--bg);border-radius:var(--radius);font-size:0.78rem;color:var(--text-light)">
        <strong>Demo:</strong> demo@lib.com / demo123
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Aurelia Library &copy; 2026</p>
      <p class="tagline">a quiet place for every story</p>
    </div>
  </footer>

  <div id="toastBox"></div>
  <script src="js/app.js"></script>
</body>
</html>
