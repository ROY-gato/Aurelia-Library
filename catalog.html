<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog - Aurelia Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Aurelia<span> Library</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html" class="active">Catalog</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div class="nav-icons">
        <div id="userMenu"></div>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:32px">
    <h2 class="page-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Book Catalog
    </h2>
    <div class="filter-bar">
      <input type="text" id="catalogSearch" placeholder="Search by title or author..." oninput="filterCatalog()">
      <select id="catalogGenre" onchange="filterCatalog()">
        <option value="all">All Genres</option>
        <option>Classic</option><option>Dystopian</option><option>Fantasy</option>
        <option>Fiction</option><option>Romance</option><option>Satire</option>
      </select>
    </div>
    <div class="book-grid" id="catalogBooks"></div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-links"><a href="about.html">About</a><span>&middot;</span><a href="index.html">Home</a><span>&middot;</span><a href="catalog.html" class="active">Catalog</a><span>&middot;</span><a href="cart.html">Cart</a></div>
      <p>Aurelia Library &copy; 2026</p>
      <p class="tagline">a quiet place for every story</p>
    </div>
  </footer>

  <!-- Floating Chat -->
  <button class="chat-fab" onclick="toggleChat()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <div class="chat-popup" id="chatPopup">
    <div class="chat-popup-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Aurelia AI
    </div>
    <div class="chat-popup-msgs" id="chatMsgs"></div>
    <div class="chat-popup-input">
      <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendChatPopup()">
      <button onclick="sendChatPopup()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <div id="toastBox"></div>
  <script src="js/app.js"></script>
  <script>
    function filterCatalog() {
      const search = (document.getElementById('catalogSearch').value || '').toLowerCase();
      const genre = document.getElementById('catalogGenre').value;
      let f = BOOKS;
      if (search) f = f.filter(b => b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search));
      if (genre !== 'all') f = f.filter(b => b.genre === genre);
      renderBooks(f, 'catalogBooks');
    }
    document.addEventListener('DOMContentLoaded', () => renderBooks(BOOKS, 'catalogBooks'));
  </script>
</body>
</html>
