<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Wishlist</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Book<span>Nest</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-icons">
        <a href="catalog.html">&#128270;</a>
        <a href="wishlist.html">&#9825; <span class="badge wish-count" style="display:none">0</span></a>
        <a href="cart.html">&#128722; <span class="badge cart-count" style="display:none">0</span></a>
        <a href="login.html">&#128100;</a>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="section">
      <div class="container">
        <h2 class="section-title">Your Wishlist</h2>
        <div id="wishlistContent"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container"><div class="footer-grid">
      <div class="footer-col"><h3>Book<span>Nest</span></h3><p>Your cozy corner of the literary world.</p></div>
      <div class="footer-col"><h4>Links</h4><ul><li><a href="index.html">Home</a></li><li><a href="catalog.html">Catalog</a></li><li><a href="contact.html">Contact</a></li></ul></div>
      <div class="footer-col"><h4>Support</h4><ul><li><a href="#">FAQ</a></li><li><a href="#">Shipping</a></li><li><a href="#">Privacy</a></li></ul></div>
    </div><div class="footer-bottom"><p>&copy; 2024 BookNest</p></div></div>
  </footer>

  <div id="toastBox"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderWishlist() {
      const el = document.getElementById('wishlistContent');
      if (wishlist.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="icon">&#9825;</div><h3>Your wishlist is empty</h3><p>Save books by clicking the heart icon.</p><a href="catalog.html" class="btn btn-primary">Explore Books</a></div>';
        return;
      }
      el.innerHTML = '<div class="wishlist-grid">' + wishlist.map(b => {
        const inCart = cart.some(c => c.id === b.id);
        return `<div class="book-card">
          <a href="book-detail.html?id=${b.id}" class="book-cover" style="background:${getCover(b.category)}">
            <div><div class="bt">${b.title}</div><div class="ba">${b.author}</div></div>
          </a>
          <div class="book-info">
            <h3><a href="book-detail.html?id=${b.id}" style="color:inherit">${b.title}</a></h3>
            <div class="author">${b.author}</div>
            <div><span class="stars">${stars(b.rating)}</span><span class="rating-num">${b.rating}</span></div>
            <div class="price"><span class="current">$${b.price.toFixed(2)}</span></div>
            <div style="display:flex;gap:6px">
              ${inCart ? '<button class="btn btn-outline btn-sm" style="flex:1" disabled>&#10003; In Cart</button>' : `<button class="btn btn-primary btn-sm" style="flex:1" onclick="addToCart(${b.id});this.disabled=true;this.className='btn btn-outline btn-sm';this.textContent='&#10003; In Cart'">Move to Cart</button>`}
              <button class="btn btn-sm" style="background:var(--error);color:#fff;border:none" onclick="toggleWishlist(${b.id});renderWishlist()">&#128465;</button>
            </div>
          </div>
        </div>`;
      }).join('') + '</div>';
    }

    renderWishlist();
    window.renderWishlist = renderWishlist;
  </script>
</body>
</html>
