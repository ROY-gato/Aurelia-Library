<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Aurelia Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Aurelia<span> Library</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div class="nav-icons">
        <div id="userMenu"></div>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:32px">
    <h2 class="page-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Your Cart
    </h2>
    <div id="cartItems"></div>
    <div id="cartSummary"></div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal" id="checkoutModal">
    <div class="modal-overlay" onclick="closeCheckout()"></div>
    <div class="modal-content">
      <button class="modal-close" onclick="closeCheckout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Checkout
      </h2>
      <form onsubmit="placeOrder(event)">
        <h3 style="font-size:0.95rem;margin-bottom:10px;color:var(--text)">Shipping Address</h3>
        <div class="form-group"><label>Full Name</label><input type="text" id="coName" placeholder="John Doe" required></div>
        <div class="form-group"><label>Street Address</label><input type="text" id="coAddr" placeholder="123 Main St" required></div>
        <div class="form-row">
          <div class="form-group"><label>City</label><input type="text" id="coCity" placeholder="New York" required></div>
          <div class="form-group"><label>ZIP Code</label><input type="text" id="coZip" placeholder="10001" required></div>
        </div>
        <div class="form-group"><label>Phone</label><input type="tel" id="coPhone" placeholder="+1 (555) 123-4567"></div>

        <h3 style="font-size:0.95rem;margin:16px 0 10px;color:var(--text)">Payment Method</h3>
        <div class="form-group">
          <select id="coPayment" onchange="document.getElementById('cardFields').style.display=this.value==='card'?'':'none'">
            <option value="card">Credit Card</option>
            <option value="paypal">PayPal</option>
            <option value="cod">Cash on Delivery</option>
          </select>
        </div>
        <div id="cardFields" style="display:block">
          <div class="form-group"><label>Card Number</label><input type="text" placeholder="4242 4242 4242 4242"></div>
          <div class="form-row">
            <div class="form-group"><label>Expiry</label><input type="text" placeholder="MM/YY"></div>
            <div class="form-group"><label>CVV</label><input type="text" placeholder="123"></div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
          Place Order
        </button>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-links"><a href="about.html">About</a><span>&middot;</span><a href="index.html">Home</a><span>&middot;</span><a href="catalog.html">Catalog</a><span>&middot;</span><a href="cart.html" class="active">Cart</a></div>
      <p>Aurelia Library &copy; 2026</p>
      <p class="tagline">a quiet place for every story</p>
    </div>
  </footer>

  <!-- Floating Chat -->
  <button class="chat-fab" onclick="toggleChat()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <div class="chat-popup" id="chatPopup">
    <div class="chat-popup-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Aurelia AI
    </div>
    <div class="chat-popup-msgs" id="chatMsgs"></div>
    <div class="chat-popup-input">
      <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendChatPopup()">
      <button onclick="sendChatPopup()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <div id="toastBox"></div>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function(){ if(!logged()){ window.location.href='login.html'; return; } renderCartPage(); });</script>
</body>
</html>
