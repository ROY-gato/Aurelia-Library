<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Aurelia Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Aurelia<span> Library</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div class="nav-icons">
        <div id="userMenu"></div>
      </div>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="card">
      <h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Create Account
      </h2>
      <p class="sub">Join Aurelia Library for free and start exploring.</p>
      <form onsubmit="register(event)">
        <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="Your name" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="you@example.com" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="regPass" placeholder="At least 4 characters" required></div>
        <div class="form-group"><label>Confirm Password</label><input type="password" id="regConfirm" placeholder="Repeat password" required></div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <div class="switch">Already have an account? <a href="login.html">Sign In</a></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-links"><a href="about.html">About</a><span>&middot;</span><a href="index.html">Home</a><span>&middot;</span><a href="catalog.html">Catalog</a><span>&middot;</span><a href="cart.html">Cart</a></div>
      <p>Aurelia Library &copy; 2026</p>
      <p class="tagline">a quiet place for every story</p>
    </div>
  </footer>

  <div id="toastBox"></div>
  <script src="js/app.js"></script>
</body>
</html>
