<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurelia Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Aurelia<span> Library</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div class="nav-icons">
        <div id="userMenu"></div>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:32px">
    <a href="catalog.html" class="btn btn-outline" style="margin-bottom:16px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to Catalog
    </a>
    <div class="detail-wrap" id="detailWrap">
      <img id="detailCover" src="" alt="Cover">
      <div class="detail-info">
        <h2 id="detailTitle"></h2>
        <div class="author" id="detailAuthor"></div>
        <div class="meta" id="detailMeta"></div>
        <div class="desc" id="detailDesc"></div>
        <div class="price" id="detailPrice"></div>
        <div style="margin-bottom:12px;font-size:0.85rem" id="detailStatus"></div>
        <div class="actions">
          <button class="btn btn-primary" id="detailBuy">Buy Now</button>
          <button class="btn btn-outline" id="detailReserve">Reserve for Library</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-links"><a href="about.html">About</a><span>&middot;</span><a href="index.html">Home</a><span>&middot;</span><a href="catalog.html">Catalog</a><span>&middot;</span><a href="cart.html">Cart</a></div>
      <p>Aurelia Library &copy; 2026</p>
      <p class="tagline">a quiet place for every story</p>
    </div>
  </footer>

  <!-- Floating Chat -->
  <button class="chat-fab" onclick="toggleChat()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <div class="chat-popup" id="chatPopup">
    <div class="chat-popup-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Aurelia AI
    </div>
    <div class="chat-popup-msgs" id="chatMsgs"></div>
    <div class="chat-popup-input">
      <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendChatPopup()">
      <button onclick="sendChatPopup()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <div id="toastBox"></div>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', loadBook);</script>
</body>
</html>
