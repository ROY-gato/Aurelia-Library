<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Checkout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Book<span>Nest</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-icons">
        <a href="cart.html">&#128722; <span class="badge cart-count" style="display:none">0</span></a>
        <a href="login.html">&#128100;</a>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="section">
      <div class="container">
        <h2 class="section-title">Checkout</h2>
        <div id="checkoutContent"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container"><div class="footer-grid">
      <div class="footer-col"><h3>Book<span>Nest</span></h3><p>Your cozy corner of the literary world.</p></div>
      <div class="footer-col"><h4>Links</h4><ul><li><a href="index.html">Home</a></li><li><a href="catalog.html">Catalog</a></li><li><a href="contact.html">Contact</a></li></ul></div>
      <div class="footer-col"><h4>Support</h4><ul><li><a href="#">FAQ</a></li><li><a href="#">Shipping</a></li><li><a href="#">Privacy</a></li></ul></div>
    </div><div class="footer-bottom"><p>&copy; 2024 BookNest</p></div></div>
  </footer>

  <div id="toastBox"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderCheckout() {
      if (cart.length === 0) {
        document.getElementById('checkoutContent').innerHTML = '<div class="empty-state"><div class="icon">&#128722;</div><h3>Your cart is empty</h3><a href="catalog.html" class="btn btn-primary">Browse Books</a></div>';
        return;
      }

      const sub = cartTotal();
      const ship = sub >= 25 ? 0 : 5.99;
      const tax = sub * 0.08;
      const total = sub + ship + tax;

      document.getElementById('checkoutContent').innerHTML = `
      <div class="checkout-wrap">
        <form class="checkout-form" id="checkoutForm" onsubmit="placeOrder(event)">
          <h2>Complete Your Order</h2>
          <div class="form-section">
            <h3><span class="step">1</span> Customer</h3>
            <div class="form-row">
              <div class="form-group"><label>First Name</label><input type="text" id="fName" required><span class="error-msg">Required</span></div>
              <div class="form-group"><label>Last Name</label><input type="text" id="lName" required><span class="error-msg">Required</span></div>
            </div>
            <div class="form-group"><label>Email</label><input type="email" id="cEmail" required><span class="error-msg">Valid email required</span></div>
          </div>
          <div class="form-section">
            <h3><span class="step">2</span> Shipping</h3>
            <div class="form-group"><label>Address</label><input type="text" id="address" required><span class="error-msg">Required</span></div>
            <div class="form-row">
              <div class="form-group"><label>City</label><input type="text" id="city" required><span class="error-msg">Required</span></div>
              <div class="form-group"><label>ZIP</label><input type="text" id="zip" required><span class="error-msg">Required</span></div>
            </div>
          </div>
          <div class="form-section">
            <h3><span class="step">3</span> Payment</h3>
            <div class="payment-options">
              <div class="payment-opt active" onclick="selectPay(this)">&#128179; Card</div>
              <div class="payment-opt" onclick="selectPay(this)">&#127991; PayPal</div>
            </div>
            <div id="cardFields">
              <div class="form-group"><label>Card Number</label><input type="text" id="cardNum" placeholder="1234 5678 9012 3456" maxlength="19" oninput="this.value=this.value.replace(/\\D/g,'').replace(/(.{4})/g,'$1 ').trim().slice(0,19)"></div>
              <div class="form-row">
                <div class="form-group"><label>Expiry</label><input type="text" id="expiry" placeholder="MM/YY" maxlength="5" oninput="let v=this.value.replace(/\\D/g,'');this.value=v.length>2?v.slice(0,2)+'/'+v.slice(2,4):v"></div>
                <div class="form-group"><label>CVV</label><input type="text" id="cvv" placeholder="123" maxlength="3" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,3)"></div>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Place Order - $${total.toFixed(2)}</button>
        </form>

        <div class="order-summary">
          <h3>Order Summary</h3>
          ${cart.map(item => `
            <div class="order-item">
              <div class="thumb"><div class="book-cover" style="background:${getCover(item.category)}"><div class="bt" style="font-size:0.45rem">${item.title}</div></div></div>
              <div class="order-item-info"><div>${item.title}</div><div class="qty">Qty: ${item.qty}</div></div>
              <div class="order-item-price">$${(item.price * item.qty).toFixed(2)}</div>
            </div>
          `).join('')}
          <div class="summary-row"><span>Subtotal</span><span>$${sub.toFixed(2)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${ship === 0 ? 'FREE' : '$'+ship.toFixed(2)}</span></div>
          <div class="summary-row"><span>Tax</span><span>$${tax.toFixed(2)}</span></div>
          <div class="summary-row total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
        </div>
      </div>`;
    }

    function selectPay(el) {
      document.querySelectorAll('.payment-opt').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('cardFields').style.display = el.textContent.includes('Card') ? 'block' : 'none';
    }

    function placeOrder(e) {
      e.preventDefault();
      const required = ['fName','lName','cEmail','address','city','zip'];
      let ok = true;
      required.forEach(id => {
        const el = document.getElementById(id);
        const grp = el.closest('.form-group');
        if (!el.value.trim()) { grp.classList.add('error'); ok = false; } else { grp.classList.remove('error'); }
      });
      if (!ok) { toast('Please fill in all required fields.', 'error'); return; }
      const num = '#BN-' + Date.now().toString().slice(-6);
      cart = []; save(); updateBadges();
      document.getElementById('checkoutContent').innerHTML = '<div class="empty-state" style="padding:80px 20px"><div class="icon">&#127881;</div><h3>Order Placed!</h3><p>Order number: <strong>' + num + '</strong></p><p style="margin-bottom:1rem">A confirmation has been sent to your email.</p><a href="index.html" class="btn btn-primary">Continue Shopping</a> <a href="profile.html" class="btn btn-outline">View Orders</a></div>';
      toast('Order placed successfully!');
    }

    renderCheckout();
    window.renderCheckoutSummary = renderCheckout;
  </script>
</body>
</html>
