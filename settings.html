<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Aurelia Library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Aurelia<span> Library</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
      </ul>
      <div class="nav-icons">
        <a href="cart.html" class="icon-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="badge cart-badge" style="display:none">0</span>
        </a>
        <div id="userMenu"></div>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:32px">
    <div class="settings-wrap">
      <div class="card">
        <h2>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Account Settings
        </h2>
        <p class="sub" style="color:var(--text-light);font-size:0.82rem;margin-bottom:20px">Update your profile information.</p>
        <form onsubmit="saveSettings(event)">
          <div class="form-group"><label>Full Name</label><input type="text" id="setName" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="setEmail" required></div>
          <hr style="border:none;border-top:1px solid var(--border);margin:16px 0">
          <div class="form-group"><label>Current Password</label><input type="password" id="setCurPass" placeholder="Leave blank to keep current"></div>
          <div class="form-group"><label>New Password</label><input type="password" id="setNewPass" placeholder="At least 4 characters"></div>
          <div class="form-group"><label>Confirm New Password</label><input type="password" id="setConfirm" placeholder="Repeat new password"></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px">Save Settings</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Aurelia Library &copy; 2026</p>
      <p class="tagline">a quiet place for every story</p>
    </div>
  </footer>

  <!-- Floating Chat -->
  <button class="chat-fab" onclick="toggleChat()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <div class="chat-popup" id="chatPopup">
    <div class="chat-popup-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Aurelia AI
    </div>
    <div class="chat-popup-msgs" id="chatMsgs"></div>
    <div class="chat-popup-input">
      <input type="text" id="chatInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')sendChatPopup()">
      <button onclick="sendChatPopup()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <div id="toastBox"></div>
  <script src="js/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', renderSettings);</script>
</body>
</html>
