<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Book Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Book<span>Nest</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-icons">
        <a href="catalog.html">&#128270;</a>
        <a href="wishlist.html">&#9825; <span class="badge wish-count" style="display:none">0</span></a>
        <a href="cart.html">&#128722; <span class="badge cart-count" style="display:none">0</span></a>
        <a href="login.html">&#128100;</a>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="section">
      <div class="container">
        <div class="breadcrumb">
          <a href="catalog.html">Catalog</a> <span>&#8250;</span> <span id="bcTitle">Book</span>
        </div>
        <div class="detail-wrap" id="detailWrap"></div>

        <div class="section" style="padding-bottom:0">
          <h2 class="section-title">You May Also Like</h2>
          <div class="grid" id="relatedGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-col">
          <h3>Book<span>Nest</span></h3>
          <p>Your cozy corner of the literary world.</p>
        </div>
        <div class="footer-col">
          <h4>Links</h4>
          <ul><li><a href="index.html">Home</a></li><li><a href="catalog.html">Catalog</a></li><li><a href="contact.html">Contact</a></li></ul>
        </div>
        <div class="footer-col">
          <h4>Support</h4>
          <ul><li><a href="#">FAQ</a></li><li><a href="#">Shipping</a></li><li><a href="#">Privacy</a></li></ul>
        </div>
      </div>
      <div class="footer-bottom"><p>&copy; 2024 BookNest</p></div>
    </div>
  </footer>

  <div id="toastBox"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function loadDetail() {
      const id = parseInt(new URLSearchParams(window.location.search).get('id'));
      const book = books.find(b => b.id === id);
      if (!book) { document.getElementById('detailWrap').innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-light)">Book not found. <a href="catalog.html">Browse catalog</a></p>'; return; }

      document.getElementById('bcTitle').textContent = book.title;
      const inCart = cart.some(b => b.id === book.id);
      const inWl = inWishlist(book.id);

      document.getElementById('detailWrap').innerHTML = `
        <div class="detail-cover">
          <div class="book-cover" style="background:${getCover(book.category)};height:420px">
            <div><div class="bt" style="font-size:1.3rem">${book.title}</div><div class="ba" style="font-size:0.9rem">${book.author}</div></div>
          </div>
        </div>
        <div class="detail-info">
          <h1>${book.title}</h1>
          <div class="author">by ${book.author}</div>
          <div class="rating">
            <span class="stars">${stars(book.rating)}</span>
            <span class="rating-text">${book.rating} / 5.0</span>
          </div>
          <div class="price-box">
            <span class="current">$${book.price.toFixed(2)}</span>
          </div>
          <p class="desc">${book.description}</p>
          <div class="detail-actions">
            ${inCart ? '<button class="btn btn-outline btn-lg" disabled>&#10003; In Cart</button>' : `<button class="btn btn-primary btn-lg" onclick="addToCart(${book.id});this.disabled=true;this.className='btn btn-outline btn-lg';this.innerHTML='&#10003; In Cart'">&#128722; Add to Cart</button>`}
            <button class="btn btn-outline btn-lg" id="wlBtn" onclick="toggleWl(${book.id})">${inWl ? '&#10084; Remove from Wishlist' : '&#9825; Add to Wishlist'}</button>
          </div>
          <div class="detail-meta">
            <span><span class="label">Category:</span>${book.category}</span>
            <span><span class="label">Year:</span>${book.year}</span>
            <span><span class="label">Rating:</span>${book.rating} &#9733;</span>
          </div>
        </div>
      `;

      const related = books.filter(b => b.id !== book.id && b.category === book.category).slice(0, 4);
      renderBooks('relatedGrid', related);
    }

    function toggleWl(id) {
      toggleWishlist(id);
      const btn = document.getElementById('wlBtn');
      const inWl = inWishlist(id);
      btn.innerHTML = inWl ? '&#10084; Remove from Wishlist' : '&#9825; Add to Wishlist';
    }

    loadDetail();
  </script>
</body>
</html>
